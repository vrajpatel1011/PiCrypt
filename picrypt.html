<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PiCrypt</title>
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: url('gallery/cover8.jpg');
      background-size: cover;
      background-position: center;
      opacity: 1;
      transition: opacity 2s ease;
      /* Adjust the transition timing */
    }

    .fadeOut {
      opacity: 0;
    }

    .content {
      position: absolute;
      transform: translate(-50%, -50%);
      text-align: center;
      color: white;
      font-size: 25px;
      font-weight: bold;
      font-family: 'Courier New', Courier, monospace;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
    }

    .great {
      font-family: "Great Vibes", cursive;
      font-weight: bold;
      top: 40%;
      left: 50%;
      font-size: 120px;
      font-style: normal;
      letter-spacing: 1px;
    }

    .great1 {
      top: 65%;
      left: 50%;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>
  <div class="background" id="background">

    <div class="content great">
      PiCrypt
    </div>
    <br><br><br>
    <div class="content great1">"HIDDEN WHISPERS: UNVEILING SECRETS IN PIXELS"</div>
  </div>
  <script>
    // Wait for the DOM content to be fully loaded
    document.addEventListener('DOMContentLoaded', function () {
      // Get the background element
      var background = document.getElementById('background');

      // Hide the background and redirect after fade-out
      setTimeout(function () {
        background.classList.add('fadeOut');
        setTimeout(function () {
          window.location.href = 'signin/index.html';
        }, 800); // Adjust the delay for the fade-out transition
      }, 2500); // Adjust the delay before fading out
    });
  </script>
</body>

</html>
