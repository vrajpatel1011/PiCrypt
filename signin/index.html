<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Signin & Signup</title>
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css'>
  <link rel="stylesheet" href="./style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/zxcvbn/4.4.2/zxcvbn.js"></script>
  <style>
    .input-container {
      position: relative;
      width: 300px;
    }

    .input-container input {
      padding-left: 35px;
      /* Space for the icon */
      width: 100%;
    }

    .input-container .icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
    }
  </style>
</head>

<body>

  <div class="container" id="container">
    <div class="form-container signin-container">
      <form action="../backend/login.php" method="POST">
        <div class="great">
          <h1>Sign in</h1>
        </div>
        <br>
        <div class="input-container">
          <i class="fas fa-envelope icon"></i>
          <input type="email" placeholder="Email" name="email" required>
        </div>
        <div class="input-container">
          <i class="fas fa-lock icon"></i>
          <input type="password" placeholder="Password" name="password" required>
        </div>
        <button>Sign In</button>
      </form>
    </div>
    <div class="form-container signup-container">
      <form action="../backend/register.php" method="POST">
        <div class="great">
          <h1>Sign Up</h1>
        </div>
        <br><br>
        <div class="input-container">
          <i class="fas fa-envelope icon"></i>
          <input type="email" placeholder="Email" name="email" required>
        </div>
        <div class="input-container">
          <i class="fas fa-lock icon"></i>
          <input type="password" id="password" name="password" placeholder="Password" oninput="checkPasswordStrength()"
            required>
        </div>
        <span id="passwordStrength"></span>
        <div class="input-container">
          <i class="fas fa-lock icon"></i>
          <input type="password" placeholder="Confirm Password" name="cpass" required>
        </div>
        <!---
    <input type="submit" value="Submit" id="submitButton" disabled> -->
        <br>
        <button>Sign up</button>
      </form>
    </div>
    <div class="overlay-container">
      <div class="overlay">
        <div class="overlay-panel overlay-left">
          <div class="great">
            <h1>Create your account</h1>
          </div>
          <p>Enter your details to get started.</p>
          <button id="signinBtn" class="ghost">Sign in</button>
        </div>

        <div class="overlay-panel overlay-right">
          <div class="great">
            <h1>Welcome to PiCrypt</h1>
          </div>
          <p><b>Sign in to "Discover the Unseen"</b></p>
          <button id="signupBtn" class="ghost">Sign up</button>
          <p id="message"></p>
        </div>
      </div>
    </div>
  </div>
  <!-- partial -->
  <script src="./script.js"></script>
  <script>
    function checkPasswordStrength() {
      var password = document.getElementById("password").value;
      var result = zxcvbn(password);
      var strength = result.score; // Score ranges from 0 to 4 (0 being weakest, 4 being strongest)
      var message;

      switch (strength) {
        case 0:
          message = "Very Weak";
          break;
        case 1:
          message = "Weak";
          break;
        case 2:
          message = "Moderate";
          break;
        case 3:
          message = "Strong";
          break;
        case 4:
          message = "Very Strong";
          break;
        default:
          message = "Unknown";
      }

      document.getElementById("passwordStrength").innerHTML = "Password Strength: " + message;

      // Enable or disable the submit button based on password strength
      var submitButton = document.getElementById("submitButton");
      submitButton.disabled = strength < 3; // Adjust the threshold as needed
    }
  </script>
</body>

</html>
