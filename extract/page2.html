<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

  <meta http-equiv="Expires" content="0">
  <title>Steganography Example</title>
  <script src="js-imagediff-master/imagediff.min.js"></script>
  <link rel='stylesheet' href='//cdnjs.cloudflare.com/ajax/libs/animate.css/3.5.2/animate.min.css'>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="close.css">
  <style>
    @import url('https://fonts.googleapis.com/css?family=Abel|Abril+Fatface|Alegreya|Arima+Madurai|Dancing+Script|Dosis|Merriweather|Oleo+Script|Overlock|PT+Serif|Pacifico|Playball|Playfair+Display|Share|Unica+One|Vibur');

    body {
      margin: 0;
      padding: 0;
      color: #5E6472;
      font-family: 'abel', sans-serif;
      opacity: .95;
      background-image: linear-gradient(-225deg, #E3FDF5 0%, #FFE6FA 100%);
      background-image: linear-gradient(to top, #a8edea 0%, #fed6e3 100%);
      background-attachment: fixed;
      background-repeat: no-repeat;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .horizontal-space {
      margin-right: 80px;
      /* Adjust the value as needed */
    }

    #container {
      max-width: 600px;
      padding: 20px;
      background-image: linear-gradient(-225deg, #E3FDF5 50%, #FFE6FA 50%);
      border-radius: 10px;
      box-shadow: 0 9px 50px hsla(20, 67%, 75%, 0.31);
      text-align: center;
    }

    input[type="file"] {
      margin-bottom: 10px;
    }

    #output {
      margin-top: 20px;
      text-align: left;
    }

    #output img {
      max-width: 100%;
      border-radius: 4px;
    }

    #psnr,
    #mse,
    #ssim {
      font-weight: bold;
      margin-bottom: 10px;
    }

    #image {
      max-width: 500px;
      /* Adjusted max-width */
      max-height: 500px;
      /* Added max-height */
      border-radius: 4px;
      margin-left: 20px;
    }

    .wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .button1 {
      min-width: 230px;
      min-height: 45px;
      font-family: 'Abel', sans-serif;
      opacity: .95;
      font-size: 18px;
      font-weight: 400;
      margin-bottom: 15px;
      color: #5E6472;
      background: #B8F2E6;
      border: none;
      border-radius: 10px;
      transition: all 0.3s ease-in-out 0s;
      cursor: pointer;
      outline: none;
      position: relative;
      padding: 10px;
    }

    /*upload button */

    .drop-zone-container {
      display: flex;
      margin-top: 10px;
      margin-left: 70px;
      margin-right: 70px;
    }

    .drop-zone {
      width: 170px;
      height: 170px;
      border: 4px solid #B8F2E6;
      /* Initial border color */
      border-color: radial-gradient(circle farthest-corner at 52.3% 31.5%, rgba(83, 138, 214, 1) 0%, rgba(134, 231, 214, 1) 90%);
      ;
      border-radius: 15px;
      display: flex;

      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;

      background-size: 100% 100%;
      /* Ensure the background image covers the entire area */
      background-position: center;
      /* Center the background image */
    }

    .image-preview {
      max-width: 170px;
      max-height: 170px;
      display: none;
      object-fit: contain;
      background-position: center;
    }

    .upload-icon {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 55px;
      height: 55px;
      opacity: 0.5;
    }

    .drop-text {
      position: absolute;
      top: 65%;
      left: 49%;
      transform: translate(-50%, -50%);
      text-align: center;
      font-size: 13px;
      color: #666;
    }

    .remove-icon {
      position: absolute;
      top: 2px;
      right: 2px;
      cursor: pointer;
      max-width: 20px;
      max-height: 20px;
      border-radius: 50%;
      display: none;
    }

    .upload-input {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    .great {
      font-family: "Great Vibes", cursive;
      font-weight: 800;
      font-size: 35px;
      font-style: normal;
    }
  </style>
</head>

<body>
  <div id="container">
    <form action="server2.php" method="post" enctype="multipart/form-data">
      <div class="great">Extract Image</div>
      <h3>Stego Image:</h3>
      <div class="drop-zone-container">
        <div class="drop-zone" id="drop-zone-left">
          <input type="file" class="upload-input" id="upload-input-left" name="stego_image" accept="image/*" required>
          <img src="../gallery/addimg.jpg" class="upload-icon" id="upload-icon-left" alt="Upload Icon">
          <p class="drop-text" id="drop-text-left">Drag & drop image or click to upload</p>
          <img src="#" class="image-preview" id="image-preview-left" alt="Image Preview">
          <img src="../gallery/remove.jpg" class="remove-icon" onclick="removeImage(event, 'drop-zone-left')">
        </div>
      </div>
      <br>
      <div class="wrap">
        <button class="button1" type="submit">Extract Image</button>
      </div>
      <!-- Button to view the image -->
      <div class="wrap">
        <button class="button1" id="viewButton" onclick="toggleView(event)">View Image</button>
      </div>
      <!-- Button to download the image -->
      <div class="wrap">
        <button class="button1" onclick="downloadImage(event)">Download Image</button>
      </div>
    </form>
  </div>

  <!-- Image container -->
  <div id="imageContainer">
    <img id="image" style="display: none;">
  </div>

  <script>
    function toggleView(event) {
      event.preventDefault();
      var image = document.getElementById('image');
      var viewButton = document.getElementById('viewButton');

      if (image.style.display === 'block') {
        // Hide the image
        image.style.display = 'none';
        // Change button text
        viewButton.textContent = 'View Image';
      } else {
        // Show the image
        var imageUrl = '../python/extract/extract.png?' + new Date().getTime();// Change 'image.jpg' to your image URL
        image.src = imageUrl;
        image.style.display = 'block';
        // Change button text
        viewButton.textContent = 'Unview Image';
      }
    }

    function downloadImage(event) {
      event.preventDefault();
      // Image URL
      var imageUrl = '../python/extract/extract.png?' + new Date().getTime();// Change 'image.jpg' to your image URL

      // Create a temporary anchor element
      var downloadLink = document.createElement('a');
      downloadLink.href = imageUrl;
      downloadLink.download = 'extract.png'; // Change 'image.jpg' to your image filename

      // Trigger the click event of the anchor element to start download
      downloadLink.click();
    }
  </script>
  <div class="close-icon" id="closeIcon">
    <div></div>
    <div></div>
  </div>
  <script>
    document.getElementById("closeIcon").addEventListener("click", function () {
      window.location.href = "../optional/index.html";
    });

  </script>
  <script>
    const dropZoneLeft = document.getElementById('drop-zone-left');
    const uploadInputLeft = document.getElementById('upload-input-left');
    const imagePreviewLeft = document.getElementById('image-preview-left');
    const uploadIconLeft = document.getElementById('upload-icon-left');
    const dropTextLeft = document.getElementById('drop-text-left');
    const removeIconLeft = document.querySelector('#drop-zone-left .remove-icon');


    dropZoneLeft.addEventListener('dragover', handleDragOver);
    dropZoneLeft.addEventListener('dragleave', handleDragLeave);
    dropZoneLeft.addEventListener('drop', (e) => handleDrop(e, 'drop-zone-left'));
    dropZoneLeft.addEventListener('click', () => uploadInputLeft.click());
    uploadInputLeft.addEventListener('change', (e) => handleInputChange(e, 'drop-zone-left'));

    function handleDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('dragover');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('dragover');
    }

    function handleDrop(e, dropZoneId) {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file) {
        handleFile(file, dropZoneId);
      }
    }

    function handleInputChange(e, dropZoneId) {
      const file = e.target.files[0];
      if (file) {
        handleFile(file, dropZoneId);
      }
    }

    function handleFile(file, dropZoneId) {
      const reader = new FileReader();
      const dropZone = document.getElementById(dropZoneId);
      const imagePreview = dropZone.querySelector('.image-preview');
      const dropText = dropZone.querySelector('.drop-text');
      const uploadIcon = dropZone.querySelector('.upload-icon');
      const removeIcon = dropZone.querySelector('.remove-icon');

      reader.onload = function (e) {
        imagePreview.src = e.target.result;
        imagePreview.style.display = 'block';
        dropText.style.display = 'none';
        uploadIcon.style.display = 'none';
        removeIcon.style.display = 'block';
        dropZone.style.borderColor = 'pink';
      };

      reader.readAsDataURL(file);
    }

    function removeImage(event, dropZoneId) {
      event.stopPropagation();
      const dropZone = document.getElementById(dropZoneId);
      const imagePreview = dropZone.querySelector('.image-preview');
      const dropText = dropZone.querySelector('.drop-text');
      const uploadIcon = dropZone.querySelector('.upload-icon');
      const removeIcon = dropZone.querySelector('.remove-icon');

      imagePreview.src = '';
      imagePreview.style.display = 'none';
      dropText.style.display = 'block';
      uploadIcon.style.display = 'block';
      removeIcon.style.display = 'none';
      dropZone.style.borderColor = '#B8F2E6';
    }

    // Add event listener to form submission
    document.getElementById('image-form').addEventListener('submit', function (event) {
      // Prevent the default form submission behavior
      event.preventDefault();

      // Retrieve the image files from the drop zones
      var imageFileLeft = document.getElementById('upload-input-left').files[0];

      // Create a FormData object to send the image files
      var formData = new FormData();
      formData.append('stego_image', imageFileLeft);

      // Send form data to backend using fetch
      fetch('your-backend-url', {
        method: 'POST',
        body: formData
      });
    });

  </script>

</body>

</html>
